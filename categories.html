<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Marques - MAROCAINTY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="categories-page">

    <nav class="navbar">
        <a href="index.html" class="btn-outline">← Retour</a>
        <div class="logo-text" style="font-family: 'Playfair Display'; font-weight: bold; font-size: 24px;">
            <span style="color: #7a1f26;">M</span><span style="color: #d67d45;">A</span><span style="color: #d67d45;">R</span><span style="color: #d67d45;">O</span><span style="color: #7c8d5c;">C</span><span style="color: #7c8d5c;">A</span><span style="color: #7c8d5c;">I</span><span style="color: #7c8d5c;">N</span><span style="color: #7c8d5c;">T</span><span style="color: #7c8d5c;">Y</span>
        </div>
    </nav>

    <div class="container">
        <h1 id="category-title" style="margin-bottom: 40px; font-family: 'Playfair Display'; color: #2d4f32; text-align: center;"></h1>
        <div id="marques-list" class="marques-grid">
            </div>
    </div>

    <script>
        // Data s77tha 3la 7sab l-Word dyalk bdbt
        const database = {
            nourriture: [
                { name: "Amlou Prestige", img: "nourr.png", stars: 5, story: "Le meilleur de l'amandier marocain transformé en délice. Un mélange luxueux d'amandes, d'huile d'argan et de miel pur.", loc: "Agadir / Souss", contact: "contact@amlouprestige.ma" }
            ],
            vetements: [
                { name: "Diamantine", img: "vett.png", stars: 5, story: "La référence de la mode traditionnelle marocaine. Des collections qui allient héritage et modernité.", loc: "Casablanca", contact: "info@diamantine.com" }
            ],
            cosmetiques: [
                { name: "Natus Marrakech", img: "nat.png", stars: 5, story: "Produits de beauté bio inspirés des rituels ancestraux du hammam.", loc: "Marrakech", contact: "hello@natus.ma" },
                { name: "BioProGreen", img: "bio.png", stars: 4, story: "Spécialiste de l'innovation verte et des huiles essentielles marocaines.", loc: "Agadir", contact: "sales@bioprogreen.com" }
            ],
            decoration: [
                { name: "Chabi Chic", img: "ch.png", stars: 5, story: "L'art de vivre marocain moderne. Céramiques et décoration bohème chic.", loc: "Marrakech", contact: "store@chabi-chic.com" }
            ],
            accessoires: [
                { name: "Olga DSN", img: "olga.png", stars: 4, story: "Maroquinerie d'excellence alliant design contemporain et cuir de qualité.", loc: "Rabat", contact: "contact@olgadsn.ma" }
            ],
            bijoux: [
                { name: "Artisans du Sud", img: "bij.png", stars: 5, story: "Bijoux traditionnels revisités pour l'élégance d'aujourd'hui.", loc: "Tiznit", contact: "bijoux@marocainty.ma" }
            ]
        };

        // Script bach n-jbdou l-category mn l-URL
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'nourriture';
        
        // Affichage dial l-univer
        document.getElementById('category-title').innerText = "Univers : " + type.toUpperCase();

        const list = document.getElementById('marques-list');
        
        // Vérification wach l-category kayna
        if (database[type]) {
            database[type].forEach(brand => {
                const card = document.createElement('div');
                card.className = 'brand-card';
                card.innerHTML = `
                    <div class="brand-header">
                        <img src="${brand.img}" class="brand-logo" onerror="this.src='https://via.placeholder.com/65'">
                        <div class="brand-info">
                            <h3>${brand.name}</h3>
                            <div class="stars">${'★'.repeat(brand.stars)}${'☆'.repeat(5-brand.stars)}</div>
                        </div>
                        <i data-lucide="chevron-down" class="arrow-icon"></i>
                    </div>
                    <div class="brand-details">
                        <div class="story-section">
                            <h4><i data-lucide="book-open"></i> Histoire de la marque</h4>
                            <p>${brand.story}</p>
                        </div>
                        <div class="contact-grid">
                            <div class="contact-item">
                                <i data-lucide="map-pin"></i>
                                <div><strong>Ville:</strong> ${brand.loc}</div>
                            </div>
                            <div class="contact-item">
                                <i data-lucide="mail"></i>
                                <div><strong>Email:</strong> ${brand.contact}</div>
                            </div>
                        </div>
                    </div>
                `;
                card.onclick = () => card.classList.toggle('active');
                list.appendChild(card);
            });
            lucide.createIcons();
        } else {
            list.innerHTML = "<p style='text-align:center;'>Aucune marque trouvée pour cette catégorie.</p>";
        }
    </script>
</body>
</html>
